[project]
name = "tap-datacircle"
version = "0.1.0"
description = "Singer tap for the Datacircle API: every GTM API, its best plans and prices, with no key."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["singer-sdk>=0.40", "requests"]

[project.scripts]
tap-datacircle = "tap_datacircle.tap:TapDatacircle.cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
